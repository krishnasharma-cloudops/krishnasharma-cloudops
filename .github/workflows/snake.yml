name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark animated SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2321BFA8&color_dots=%23E5E7EB,%2399E3D8,%235DD8C6,%2328ACAF,%230D7377
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%235CE4D0

      - name: Publish animated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
